<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAILASH | Full-Stack Developer</title>
  <meta name="description" content="Learning full-stack development, building apps and bots, and working toward becoming a software engineer.">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Inter:wght@300;400;600;800&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Ambient Glow Background Effects -->
  <div class="ambient-glow glow-top"></div>
  <div class="ambient-glow glow-bottom"></div>

  <main class="container">
    
    <!-- Top Capsule Line Render Header -->
    <div class="header-line-wrapper scroll-anim anim-fade-down" id="header-bar">
      <img src="https://capsule-render.vercel.app/api?type=rect&color=0:050505,50:120000,100:8B0000&height=8&section=header" alt="Header Accent" class="header-line-img">
    </div>

    <!-- Hero Header -->
    <header class="hero scroll-anim anim-zoom-in" id="hero-section">
      <h1 class="glitch-title" data-text="KAILASH">KAILASH</h1>
      <h3 class="subtitle">FULL-STACK DEVELOPER</h3>
      <p class="bio">
        Learning full-stack development, building apps and bots,<br>
        and working toward becoming a software engineer.
      </p>
    </header>

    <hr class="divider scroll-anim anim-expand-line" id="divider-1">

    <!-- 01 / SKILLS -->
    <section class="skills-section" id="skills">
      <h2 class="section-title scroll-anim anim-slide-left">01 / SKILLS</h2>
      
      <div class="skills-grid">
        <div class="skill-card scroll-anim anim-card-stagger" style="--delay: 0.05s;">
          <img src="https://skillicons.dev/icons?i=python&theme=dark" width="48" height="48" alt="Python">
          <span>Python</span>
        </div>

        <div class="skill-card scroll-anim anim-card-stagger" style="--delay: 0.1s;">
          <img src="https://skillicons.dev/icons?i=typescript&theme=dark" width="48" height="48" alt="TypeScript">
          <span>TypeScript</span>
        </div>

        <div class="skill-card scroll-anim anim-card-stagger" style="--delay: 0.15s;">
          <img src="https://skillicons.dev/icons?i=javascript&theme=dark" width="48" height="48" alt="JavaScript">
          <span>JavaScript</span>
        </div>

        <div class="skill-card scroll-anim anim-card-stagger" style="--delay: 0.2s;">
          <img src="https://skillicons.dev/icons?i=react&theme=dark" width="48" height="48" alt="React">
          <span>React</span>
        </div>

        <div class="skill-card scroll-anim anim-card-stagger" style="--delay: 0.25s;">
          <img src="https://skillicons.dev/icons?i=react&theme=dark" width="48" height="48" alt="React Native">
          <span>React Native</span>
        </div>

        <div class="skill-card scroll-anim anim-card-stagger" style="--delay: 0.3s;">
          <img src="https://skillicons.dev/icons?i=supabase&theme=dark" width="48" height="48" alt="Supabase">
          <span>Supabase</span>
        </div>

        <div class="skill-card scroll-anim anim-card-stagger" style="--delay: 0.35s;">
          <img src="https://skillicons.dev/icons?i=git&theme=dark" width="48" height="48" alt="Git">
          <span>Git</span>
        </div>

        <div class="skill-card scroll-anim anim-card-stagger" style="--delay: 0.4s;">
          <img src="https://skillicons.dev/icons?i=github&theme=dark" width="48" height="48" alt="GitHub">
          <span>GitHub</span>
        </div>

        <div class="skill-card scroll-anim anim-card-stagger" style="--delay: 0.45s;">
          <img src="https://skillicons.dev/icons?i=postgres&theme=dark" width="48" height="48" alt="SQL">
          <span>SQL</span>
        </div>

        <div class="skill-card scroll-anim anim-card-stagger" style="--delay: 0.5s;">
          <span class="emoji-icon">📱</span>
          <span>Telegram Bots</span>
        </div>
      </div>
    </section>

    <hr class="divider scroll-anim anim-expand-line" id="divider-2">

    <!-- 02 / GITHUB ACTIVITY -->
    <section class="activity-section" id="github-activity">
      <h2 class="section-title scroll-anim anim-slide-right">02 / GITHUB ACTIVITY</h2>
      
      <div class="activity-cards">
        <div class="widget-wrapper scroll-anim anim-scale-up" id="streak-wrapper">
          <img 
            src="https://streak-stats.demolab.com?user=mrdevil42023&theme=dark&hide_border=true&background=050505&ring=FF2020&fire=FF2020&currStreakLabel=FF2020&sideLabels=FFFFFF&currStreakNum=FFFFFF&sideNums=FFFFFF&dates=777777" 
            alt="GitHub Contribution Streak"
            class="widget-img streak-img"
          >
        </div>

        <div class="widget-wrapper scroll-anim anim-scale-up" id="graph-wrapper" style="--delay: 0.15s;">
          <img 
            src="https://github-readme-activity-graph.vercel.app/graph?username=mrdevil42023&bg_color=050505&color=FFFFFF&line=FF2020&point=FF4040&area=true&hide_border=true&custom_title=CONTRIBUTION%20ACTIVITY" 
            alt="GitHub Contribution Activity"
            class="widget-img activity-img"
          >
        </div>
      </div>
    </section>

    <hr class="divider scroll-anim anim-expand-line" id="divider-3">

    <!-- Footer & Profile Link -->
    <footer class="footer scroll-anim anim-fade-up" id="footer-section">
      <a href="https://github.com/mrdevil42023" target="_blank" rel="noopener noreferrer" class="badge-link">
        <img 
          src="https://img.shields.io/badge/GITHUB-@mrdevil42023-050505?style=for-the-badge&logo=github&logoColor=FF2020&labelColor=050505" 
          alt="GitHub profile"
          class="badge-img"
        >
      </a>

      <h3 class="footer-motto scroll-anim anim-pulse">BUILD · LEARN · SHIP · REPEAT</h3>
    </footer>

  </main>

  <script src="script.js"></script>
</body>
</html>
