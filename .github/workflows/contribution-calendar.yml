name: Update Contribution Calendar

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - generate.js
      - .github/workflows/contribution-calendar.yml

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    env:
      PROFILE_USERNAME: mrdevil42023
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate contribution calendar
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node generate.js

      - name: Commit updated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/contribution-calendar.svg
          if git diff --cached --quiet; then
            echo "Contribution calendar is already up to date."
          else
            git commit -m "chore: update contribution calendar"
            git push
          fi
